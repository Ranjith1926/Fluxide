[package]
name = "fluxide"
version = "1.0.0"
description = "FluxIDE — Offline AI Coding. Supercharged."
authors = ["FluxIDE"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fluxide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

anyhow = "1"
thiserror = "1"

walkdir = "2"
notify = { version = "6", features = ["serde"] }

portable-pty = "0.8"

reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }

uuid = { version = "1", features = ["v4"] }

log = "0.4"
env_logger = "0.11"

once_cell = "1"
parking_lot = "0.12"

dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
